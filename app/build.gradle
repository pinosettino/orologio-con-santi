plugins {
    id 'com.android.application'
}

android {
    namespace 'it.orologiosanti'
    compileSdk 34

    defaultConfig {
        applicationId "it.orologiosanti"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // Chiave di firma fissa: cosi' ogni nuovo APK si installa sopra quello vecchio
    // senza dover disinstallare l'app (e senza perdere gli appunti).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
